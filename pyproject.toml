# 项目依赖与命令行入口；模型加载和外部请求只在业务命令执行时发生。
[project]
name = "wattbot"
version = "0.1.0"
description = "基于 Docling、LangChain 和 MiMo 的 WattBot 多模态 RAG"
authors = [
    { name = "DeianHsu", email = "663781679@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "docling>=2.130.0",
    "docling-core[chunking]",
    "langchain-chroma>=1.1.0",
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.3",
    "langchain-text-splitters>=1.1.2",
    "pandas>=3.0.6",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "sentence-transformers>=6.1.0",
    "torch==2.14.0",
]

# Windows 上从 PyTorch 官方索引安装 CUDA 版；其他平台沿用默认来源。
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
wattbot = "wattbot.main:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
